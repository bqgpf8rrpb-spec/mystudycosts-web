name: Update Erasmus Partner Data

on:
  schedule:
    - cron: '0 2 1 */3 *'  # Quarterly: 1st day of Jan/Apr/Jul/Oct at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-erasmus:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download EU Erasmus+ Mobility Raw Data
        run: node scripts/download-erasmus-data.js

      - name: Transform to ErasmusPartnerDatabase format
        run: node scripts/transform-erasmus-data.js

      - name: Merge with MoveOn scraped data
        run: node scripts/merge-erasmus-sources.js

      - name: Map partners to programs
        run: node scripts/map-partners-to-programs.js

      - name: Run quality check
        run: node scripts/quality-check.js || true

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet data/erasmus_partners.json data/german_uni_mapping.json data/university_master_2026.json data/quality_snapshot.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit and push changes
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git add data/erasmus_partners.json data/german_uni_mapping.json data/university_master_2026.json data/quality_snapshot.json data/quality_report.txt
          git commit -m "chore: update erasmus partner data (EU + MoveOn merge, map to programs)"
          git push

      - name: Summary
        run: |
          if [ "${{ steps.check-changes.outputs.changed }}" = "true" ]; then
            echo "Updated erasmus_partners.json, german_uni_mapping.json, university_master, and quality snapshot"
          else
            echo "No changes detected. Erasmus data is up to date."
          fi
