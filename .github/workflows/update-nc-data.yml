name: Update NC Data

on:
  schedule:
    # Run every Monday at 3:00 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-nc-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Required to commit and push changes
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Fetch all history for better diff detection
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml
      
      - name: Run NC data update script
        id: update-nc
        run: |
          python data/scripts/fetch_ncs.py
        continue-on-error: true # Continue even if some updates fail
      
      - name: Check for changes
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain data/university_programs.json)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected in university_programs.json"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No changes detected"
          fi
      
      - name: Configure Git
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      
      - name: Commit changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git add data/university_programs.json
          git commit -m "chore: update NC data from automated pipeline [skip ci]"
      
      - name: Push changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git push origin HEAD:main
      
      - name: Trigger Vercel deployment
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        continue-on-error: true # Don't fail if Vercel deployment fails
      
      - name: Summary
        run: |
          if [ "${{ steps.check-changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ NC data updated successfully"
            echo "📦 Changes committed and pushed"
            echo "🚀 Vercel deployment triggered"
          else
            echo "ℹ️  No updates needed"
          fi

