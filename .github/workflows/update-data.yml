name: Update University Data

on:
  workflow_dispatch:

permissions:
  contents: write  # Required to commit and push changes

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Use Node.js 20 (LTS)
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run data population script
        run: node scripts/populate-data.js

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet data/university_programs.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in university_programs.json"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in university_programs.json"
          fi

      - name: Configure Git
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit and push changes
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git add data/university_programs.json
          git commit -m "chore: automated university data update"
          git push

      - name: Summary - Changes detected
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          echo "✅ Successfully updated university_programs.json and pushed changes"
          echo "ℹ️ NC scraping runs in update-nc-data.yml (single source of truth)."

      - name: Summary - No changes
        if: steps.check-changes.outputs.changed == 'false'
        run: |
          echo "ℹ️ No changes detected. Data is up to date."
          echo "ℹ️ NC scraping runs in update-nc-data.yml (single source of truth)."

